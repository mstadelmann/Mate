name: Version Bump

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

jobs:
  bump-on-pr-update:
    name: Bump patch version on PR update
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'chore/bump-minor-version')
    runs-on: ubuntu-latest
    concurrency:
      group: version-bump-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.VERSION_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check latest commit
        id: latest
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == "chore: bump patch version (PR update)" ]]; then
            echo "is_bump_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_bump_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.latest.outputs.is_bump_commit == 'false'
        run: bash .github/scripts/bump-cmake-version.sh patch

      - name: Commit version bump
        if: steps.latest.outputs.is_bump_commit == 'false'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "chore: bump patch version (PR update)" || echo "No changes to commit"
          git push origin "HEAD:${BRANCH}"

  bump-on-merge:
    name: Bump minor version on PR merge
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency:
      group: version-bump-merge-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}
          token: ${{ secrets.VERSION_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Bump minor version
        run: bash .github/scripts/bump-cmake-version.sh minor

      - name: Commit version bump
        env:
          BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "chore: bump minor version (PR merge)" || echo "No changes to commit"
          git push origin "HEAD:${BRANCH}"
