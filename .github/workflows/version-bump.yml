name: Version Bump

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

jobs:
  bump-on-pr-push:
    name: Bump patch version on PR update
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure branch has open PR
        id: pr
        uses: octokit/request-action@v2.x
        with:
          route: GET /repos/${{ github.repository }}/pulls
          per_page: 100
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine if current branch has an open PR
        id: has_pr
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          echo "Checking PRs for branch: $branch"
          echo "$PR_LIST" > prs.json
          if jq -e --arg b "$branch" '.[] | select(.head.ref == $b and .state == "open")' prs.json > /dev/null; then
            echo "has_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_LIST: ${{ steps.pr.outputs.data }}

      - name: Bump patch version
        if: steps.has_pr.outputs.has_pr == 'true'
        run: |
          file=CMakeLists.txt
          line=$(grep -n "project(Mate VERSION" "$file" | cut -d: -f1)
          if [ -z "$line" ]; then
            echo "Version line not found" && exit 1
          fi
          current=$(sed -n "${line}p" "$file" | sed -E 's/.*VERSION ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
          IFS='.' read -r major minor patch <<< "${current}.0"
          patch=$((patch + 1))
          new="$major.$minor.$patch"
          echo "Bumping version $current -> $new"
          sed -i "${line}s/VERSION .*/VERSION ${new})/" "$file"

      - name: Commit version bump
        if: steps.has_pr.outputs.has_pr == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "chore: bump patch version (PR update)" || echo "No changes to commit"
          git push

  bump-on-merge:
    name: Bump minor version on PR merge
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump minor version
        run: |
          file=CMakeLists.txt
          line=$(grep -n "project(Mate VERSION" "$file" | cut -d: -f1)
          if [ -z "$line" ]; then
            echo "Version line not found" && exit 1
          fi
          current=$(sed -n "${line}p" "$file" | sed -E 's/.*VERSION ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
          IFS='.' read -r major minor patch <<< "${current}.0"
          minor=$((minor + 1))
          patch=0
          new="$major.$minor.$patch"
          echo "Bumping version $current -> $new"
          sed -i "${line}s/VERSION .*/VERSION ${new})/" "$file"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "chore: bump minor version (PR merge)" || echo "No changes to commit"
          git push origin HEAD:main || git push
