globals:
  project: Chess
  author: Marc
  comment: >
    Same training loop, data, losses and hyperparameters as
    chess_cnn_p00.yaml, but a plain fully-connected network (chess_fc.py)
    instead of a CNN - no convolutions, no weight sharing across board
    squares. Purely to contrast the two architectures side by side; not
    meant to produce a strong engine. Kept as a standalone file rather
    than a `defaults: [chess_cnn_p00]` override (see chess_cnn_p01.yaml)
    because fdq instantiates models as `cls(**args)` (experiment.py) with
    no unused-kwarg filtering - merging onto chess_cnn_p00's model args
    would leak its CNN-only conv_channels/kernel_size keys into ChessFC's
    constructor and crash. Model key is "chessFC" (not reused as
    "chessCNN") for clarity - train.py picks it up via train.args.model_name
    below, so the same train.py trains either architecture unchanged.

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

models:
  chessFC:
    path: "~/dev/Mate/torch_model/fdq/chess_fc.py"
    class_name: "ChessFC"
    args:
      nb_in_channels: 16
      board_size: 8
      hidden_dims: [1024, 512]
    optimizer:
      class_name: "torch.optim.Adam"
      args:
        lr: 0.001

train:
  path: "~/dev/Mate/torch_model/fdq/train.py"
  args:
    model_name: chessFC
    epochs: 100
    use_GPU: true
    use_AMP: false
    accumulate_grad_batches: 1
    early_stop_val_loss: 5
    early_stop_train_loss: 5
    early_stop_nan: 5

losses:
  ce_from:
    class_name: "torch.nn.CrossEntropyLoss"
  ce_to:
    class_name: "torch.nn.CrossEntropyLoss"

data:
  CHESS:
    processor: "~/dev/Mate/torch_model/fdq/chess_preparator.py"
    args:
      base_path: "~/data_ML/chess/"
      train_set: "standard-chess-games_nbGames2000_minElo1800_train.chessarray"
      test_set: "standard-chess-games_nbGames2000_minElo1800_test.chessarray"
      subset_train: 1.0
      subset_test: 1.0
      val_ratio: 0.1
      pin_memory: true
      num_workers: 4
      train_batch_size: 256
      val_batch_size: 256
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false

store:
  results_path: "~/data_ML/results"
  img_exp_nb: 4
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: true
  checkpoint_frequency: 2
  use_tensorboard: false
  use_wandb: false
  wandb_project: "Chess"
  wandb_entity: "stmd"

test:
  processor: "~/dev/Mate/torch_model/fdq/chess_evaluator.py"
  test_model: "best"
  args:
    metrics:
      nb_test_samples: "100"
