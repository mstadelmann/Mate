defaults:
  - chess_rl_p00

globals:
  project: Chess
  author: Marc
  comment: >
    Same training as chess_rl_p00.yaml (vs "random"), but evaluated against
    the tougher "sunfish-uci" instead - an honest check for whether it
    generalizes beyond beating random, not just a harder test. Expect a
    low win rate (even losing outright) until training itself moves up a
    tier - see chess_rl_p02.yaml. Requires Sunfish (`pip install sunfish`).

test:
  args:
    engine_command: "sunfish-uci" # tougher eval opponent than train.args' "random"
