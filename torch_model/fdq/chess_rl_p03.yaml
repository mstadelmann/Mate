globals:
  project: Chess
  author: Marc
  comment: >
    Curriculum rung 3: trains and evaluates against a real Stockfish
    binary instead of Sunfish (see chess_rl_p02.yaml for rung 2), using its
    "Skill Level" option (0-20) to start beatable rather than full-strength.
    Update engine_command below to your actual Stockfish path - see
    torch_model/rl_training.md section 3 for install options (no root
    needed: a downloaded static binary works fine).

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

models:
  chessRL:
    path: "~/dev/Mate/torch_model/fdq/chess_cnn.py"
    class_name: "ChessCNN"
    args:
      nb_in_channels: 16
      conv_channels: [64, 64, 128, 128]
      kernel_size: 3
    optimizer:
      class_name: "torch.optim.Adam"
      args:
        lr: 0.0003

train:
  path: "~/dev/Mate/torch_model/fdq/train_rl.py"
  args:
    epochs: 50
    use_GPU: false
    use_AMP: false
    accumulate_grad_batches: 1
    early_stop_val_loss: 1000
    early_stop_train_loss: 1000
    early_stop_nan: 5
    games_per_epoch: 100 # self-play games played per "epoch"
    games_per_update: 8 # games averaged together before each gradient step
    max_plies_per_game: 200 # safety cap; games rarely need this many plies

    engine_command: "~/stockfish/stockfish-linux-x86-64-universal" # <-- set to your actual Stockfish binary path
    engine_uci_options: { "Skill Level": 0 } # 0 (weakest) - 20 (full strength); raise once the model reliably wins
    engine_movetime_ms: 50 # per-move think time cap

# must stay present (as null), not omitted - fdq crashes if this key is
# missing entirely. Loss is computed directly in train_rl.py instead.
losses: null

data:
  # unused for training (self-play generates its own games) - only needed
  # so mode.dump_model has example data to trace an export from.
  CHESS:
    processor: "~/dev/Mate/torch_model/fdq/chess_preparator.py"
    args:
      base_path: "~/data_ML/chess/"
      train_set: "standard-chess-games_nbGames2000_minElo1800_train.chessarray"
      test_set: "standard-chess-games_nbGames2000_minElo1800_test.chessarray"
      subset_train: 1.0
      subset_test: 1.0
      val_ratio: 0.1
      pin_memory: true
      num_workers: 4
      train_batch_size: 256
      val_batch_size: 256
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false

store:
  results_path: "~/data_ML/results"
  img_exp_nb: 4
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: true
  checkpoint_frequency: 2
  use_tensorboard: false
  use_wandb: false
  wandb_project: "Chess"
  wandb_entity: "stmd"

test:
  processor: "~/dev/Mate/torch_model/fdq/rl_evaluator.py" # not chess_evaluator.py - see rl_training.md section 4.5
  test_model: "best"
  args:
    nb_eval_games: 50
    max_plies_per_game: 200
    engine_command: "~/stockfish/stockfish-linux-x86-64-universal" # <-- same as train.args above; same tier check
    engine_uci_options: { "Skill Level": 0 }
    engine_movetime_ms: 50
