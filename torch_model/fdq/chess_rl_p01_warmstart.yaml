defaults:
  - chess_rl_p00_random

globals:
  project: Chess
  author: Marc
  comment: >
    Warm start: RL fine-tuning of the best supervised CNN (chess_cnn_p01,
    run fervent_keller, best_val epoch 148 - highest test accuracy, and
    68/100 greedy wins vs random before any RL) instead of training from
    random weights. Trains and evaluates against "random", since the
    supervised model still loses almost every game against Stockfish
    Skill Level 0 - see rl_training.md section 8.

models:
  chessRL:
    optimizer:
      args:
        lr: 0.0001 # lower than from scratch: fine-tune, don't overwrite the supervised knowledge

train:
  args:
    init_weights_path: "~/data_ML/results/Chess/chess_cnn_p01/20260930_03_20_44__hopeful_babbage/best_val_chessCNN_e791_temp_copy.fdqm"
    freeze_batchnorm_stats: true # keep the supervised BatchNorm statistics
    engine_command: "random"

test:
  args:
    nb_eval_games: 100
    engine_command: "random"
    # engine_command: "sunfish-uci"
    # engine_command: "/usr/games/stockfish"
    # engine_uci_options: { "Skill Level": 0 }

