defaults:
  - chess_cnn_p00

globals:
  project: Chess
  author: Marc
  comment: >
    Same as chess_cnn_p00.yaml, but trained on the 100k-game dataset
    (nbGames100000) instead of the 2k one - generate it with
    torch_model/data_preparation/chess_tensor_config_100k.yaml (see
    torch_model/torch_model.md section 1).

data:
  CHESS:
    args:
      train_set: "standard-chess-games_nbGames100000_minElo1800_train.chessarray"
      test_set: "standard-chess-games_nbGames100000_minElo1800_test.chessarray"
