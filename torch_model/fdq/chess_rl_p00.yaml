globals:
  project: Chess
  author: Marc
  comment: >
    train.args.engine_command "random" = training opponent (no engine, random legal moves).
    test.args.engine_command "random" = evaluation opponent, set independently.
    Curriculum rung 1: train and test against the same (weak) opponent -
    confirms it beats what it trained on.

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null # RL trains from scratch (random init) - see torch_model/rl_training.md

models:
  chessRL:
    # Same architecture as chess_cnn_p00.yaml's "chessCNN" - only the key
    # name differs, so exports stay distinguishable.
    path: "~/dev/Mate/torch_model/fdq/chess_cnn.py"
    class_name: "ChessCNN"
    args:
      nb_in_channels: 16
      conv_channels: [64, 64, 128, 128]
      kernel_size: 3
    optimizer:
      class_name: "torch.optim.Adam"
      args:
        lr: 0.0003

train:
  path: "~/dev/Mate/torch_model/fdq/train_rl.py"
  args:
    epochs: 50
    use_GPU: true
    use_AMP: false
    accumulate_grad_batches: 1
    early_stop_val_loss: 1000
    early_stop_train_loss: 1000
    early_stop_nan: 5
    games_per_epoch: 100 # self-play games played per "epoch"
    games_per_update: 8 # games averaged together before each gradient step
    max_plies_per_game: 200 # safety cap; games rarely need this many plies

    engine_command: "random"
    engine_uci_options: {} # UCI setoption params; empty for "random"/Sunfish, e.g. {"Skill Level": 0} for Stockfish
    engine_movetime_ms: 50 # per-move think time cap; ignored for "random"

# must stay present (as null), not omitted - fdq crashes if this key is
# missing entirely. Loss is computed directly in train_rl.py instead.
losses: null

data:
  # unused for training (self-play generates its own games) - only needed
  # so mode.dump_model has example data to trace an export from.
  CHESS:
    processor: "~/dev/Mate/torch_model/fdq/chess_preparator.py"
    args:
      base_path: "~/data_ML/chess/"
      train_set: "standard-chess-games_nbGames2000_minElo1800_train.chessarray"
      test_set: "standard-chess-games_nbGames2000_minElo1800_test.chessarray"
      subset_train: 1.0
      subset_test: 1.0
      val_ratio: 0.1
      pin_memory: true
      num_workers: 4
      train_batch_size: 256
      val_batch_size: 256
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false

store:
  results_path: "~/data_ML/results"
  img_exp_nb: 4
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: true
  checkpoint_frequency: 2
  use_tensorboard: false
  use_wandb: false
  wandb_project: "Chess"
  wandb_entity: "stmd"

test:
  processor: "~/dev/Mate/torch_model/fdq/rl_evaluator.py"
  test_model: "best"
  args:
    nb_eval_games: 50
    max_plies_per_game: 200
    engine_command: "random"
    engine_uci_options: {}
    engine_movetime_ms: 50
