globals:
  project: Chess
  author: Marc

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null # RL trains from scratch (random init) - see torch_model/rl_training.md

models:
  chessCNN:
    # Same architecture, same args, as the supervised pipeline
    # (chess_cnn_p00.yaml) - this is what makes the two training methods
    # interchangeable from the C++ engine's point of view: only how the
    # weights were produced differs, not the model shape or ONNX contract.
    path: "~/dev/Mate/torch_model/fdq/chess_cnn.py"
    class_name: "ChessCNN"
    args:
      nb_in_channels: 16
      conv_channels: [64, 64, 128, 128]
      kernel_size: 3
    optimizer:
      class_name: "torch.optim.Adam"
      args:
        lr: 0.0003 # lower than the supervised lr=0.001 - policy-gradient
        # updates are much noisier (each one is estimated from just a
        # handful of self-play games), so a smaller step size avoids
        # over-reacting to any single batch's noisy signal

train:
  path: "~/dev/Mate/torch_model/fdq/train_rl.py"
  args:
    epochs: 50
    use_GPU: false
    use_AMP: false
    accumulate_grad_batches: 1
    # Early stopping on a self-play policy loss is not very meaningful (see
    # torch_model/rl_training.md) - these are set loose so runs don't stop
    # themselves prematurely; a person should decide when "enough" self-play
    # has happened, e.g. by watching the win/draw/loss rate printed each epoch.
    early_stop_val_loss: 1000
    early_stop_train_loss: 1000
    early_stop_nan: 5

    # --- Self-play specific settings ---
    games_per_epoch: 100 # self-play games played per "epoch"
    games_per_update: 8 # games averaged together before each gradient step
    max_plies_per_game: 200 # safety cap; games rarely need this many plies

    # The training-time opponent - never linked into Mate itself, only
    # used here. Default is "random" (uniformly random legal moves, no
    # engine process, no install of any kind, always genuinely beatable) -
    # a first curriculum stage to get a from-scratch network off the
    # ground. See torch_model/rl_training.md section 3 for the measured
    # reason this matters: Sunfish, unlike Stockfish, has no real "easy
    # mode" and can keep beating a from-scratch network even at minimal
    # search time. Once win rate vs "random" climbs well above 50%, switch
    # to "sunfish-uci" (`pip install sunfish` - pure Python, no root
    # needed, good for locked-down clusters) for a tougher second stage,
    # or to a real Stockfish binary path if you have install access
    # (strongest, and has its own extra "Skill Level" knob).
    engine_command: "random"
    # Passed to the engine's UCI setoption command as-is; leave empty for
    # "random" and for engines with no strength knob (Sunfish has none).
    # For Stockfish, set this to {"Skill Level": 0} instead.
    engine_uci_options: {}
    # A short per-move time budget is what actually keeps ANY real engine
    # easy to beat here, regardless of whether it has its own strength
    # knob - see train_rl.py for why a beatable opponent matters for
    # REINFORCE. Ignored when engine_command is "random".
    engine_movetime_ms: 50

# `losses` must still be present (as null) even though it's unused - fdq
# reads `cfg.losses` via plain attribute access in createLosses(), which
# raises ConfigAttributeError if the key is missing entirely (only an
# explicit null is handled gracefully). The policy-gradient loss
# (-return * log_prob) is computed directly in train_rl.py instead, since
# it depends on the game outcome rather than comparing a prediction to a
# fixed label the way a standard nn.Module loss does.
losses: null

data:
  # Not used for training (self-play generates its own games on the fly).
  # Kept only so `mode.dump_model` and `chess_evaluator.py` have some real
  # positions to build an example tensor from / measure move-matching
  # against human games - reusing whatever you already generated for the
  # supervised pipeline is fine, the values are never used as training
  # labels here.
  CHESS:
    processor: "~/dev/Mate/torch_model/fdq/chess_preparator.py"
    args:
      base_path: "~/data_ML/chess/"
      train_set: "standard-chess-games_nbGames2000_minElo1800_train.chessarray"
      test_set: "standard-chess-games_nbGames2000_minElo1800_test.chessarray"
      subset_train: 1.0
      subset_test: 1.0
      val_ratio: 0.1
      pin_memory: true
      num_workers: 4
      train_batch_size: 256
      val_batch_size: 256
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false

store:
  results_path: "~/data_ML/results"
  img_exp_nb: 4
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: true
  checkpoint_frequency: 2
  use_tensorboard: false
  use_wandb: false
  wandb_project: "Chess"
  wandb_entity: "stmd"

test:
  processor: "~/dev/Mate/torch_model/fdq/chess_evaluator.py"
  test_model: "best"
  args:
    metrics:
      nb_test_samples: "100"
