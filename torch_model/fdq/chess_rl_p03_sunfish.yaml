defaults:
  - chess_rl_p00_random

globals:
  project: Chess
  author: Marc
  comment: >
    Curriculum rung 2: trains against "sunfish-uci" instead of "random"
    Requires Sunfish (`pip install sunfish`).
    for both training and testing.

models:
  chessRL:
    optimizer:
      args:
        lr: 0.0001 # lower than from scratch (p00): fine-tune, don't overwrite the warm-start weights

train:
  args:
    engine_command: "sunfish-uci"
    # Warm start from the best supervised CNN - see rl_training.md section 7.
    init_weights_path: "~/data_ML/results/Chess/chess_cnn_p01/20260923_17_37_49__fervent_keller/best_val_chessCNN_e148.fdqm"
    freeze_batchnorm_stats: true # keep the supervised BatchNorm statistics

test:
  args:
    engine_command: "random"
    # engine_command: "sunfish-uci"
    # engine_command: "/usr/games/stockfish"
    # engine_uci_options: { "Skill Level": 0 }
