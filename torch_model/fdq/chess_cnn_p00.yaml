defaults:
  - wandb_keys
  - _self_

globals:
  project: Chess
  author: Marc

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: true
  dump_model_interactive: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

models:
  chessCNN:
    path: "~/dev/Mate/torch_model/fdq/chess_cnn.py"
    class_name: "ChessCNN"
    args:
      nb_in_channels: 16
      conv_channels: [64, 64, 128, 128]
      kernel_size: 3
      dropout: 0.3 # before the heads; against overfitting (val loss rose from epoch 2-10 on)
    optimizer:
      # AdamW = Adam with decoupled weight decay (here AdamW's own default,
      # 0.01) - plain Adam's weight_decay is much weaker with adaptive LRs.
      class_name: "torch.optim.AdamW"
      args:
        lr: 0.001
        weight_decay: 0.01

train:
  path: "~/dev/Mate/torch_model/fdq/train.py"
  args:
    model_name: chessCNN
    epochs: 1000
    use_GPU: true
    use_AMP: false
    accumulate_grad_batches: 1
    # Stop after 15 epochs without a new best val loss - with the
    # held-out validation games it peaks within ~10 epochs, so 50 only
    # wasted time. Leaves room for 2 LR halvings by lr_plateau below.
    early_stop_val_loss: 15
    # Halve the LR after 5 epochs without a new best val loss - see train.py.
    lr_plateau:
      factor: 0.5
      patience: 5
      min_lr: 0.00001
    early_stop_train_loss: 50
    early_stop_nan: 5
    nb_engines: null # parallel engine processes playing the train/val games; null = one per CPU core

    val:
      - log_name: rdm
        nb_games: 20
        max_plies_per_game: 200
        engine_command: "random"
      - log_name: stf_0
        nb_games: 20
        max_plies_per_game: 200
        engine_command: "/usr/games/stockfish"
        engine_uci_options: { "Skill Level": 0, "Threads": 1 }
        engine_movetime_ms: 10
      - log_name: sun
        nb_games: 20
        max_plies_per_game: 200
        engine_command: "sunfish-uci"
        engine_movetime_ms: 10

losses:
  ce_from:
    class_name: "torch.nn.CrossEntropyLoss"
  ce_to:
    class_name: "torch.nn.CrossEntropyLoss"

data:
  CHESS:
    processor: "~/dev/Mate/torch_model/fdq/chess_preparator.py"
    args:
      base_path: "~/data_ML/chess/"
      train_set: "standard-chess-games_nbGames2000_minElo1800_train.chessarray"
      test_set: "standard-chess-games_nbGames2000_minElo1800_test.chessarray"
      subset_train: 1.0
      subset_test: 1.0
      val_ratio: 0.1
      pin_memory: true
      num_workers: 4
      train_batch_size: 256
      val_batch_size: 256
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false

  # Only used to build model_dump's single-board (batch=1) example tensor
  # for ONNX tracing - FDQ's exporter bakes in whatever batch size its
  # example has, and src/chess_ML.cpp always calls the model with a single
  # board, so this needs its own batch_size=1 loader, separate from the
  # batch_size=256 "CHESS" one above used for actual training. Any valid
  # dataset works here (only the tensor shape/dtype matters, not its
  # content), so this always points at the smallest/default dataset
  # regardless of which one "CHESS" above trains on.
  CHESS_EXPORT:
    processor: "~/dev/Mate/torch_model/fdq/chess_preparator.py"
    args:
      base_path: "~/data_ML/chess/"
      train_set: "standard-chess-games_nbGames2000_minElo1800_train.chessarray"
      test_set: "standard-chess-games_nbGames2000_minElo1800_test.chessarray"
      subset_train: 1.0
      subset_test: 1.0
      val_ratio: 0.1
      pin_memory: false
      num_workers: 0
      train_batch_size: 1
      val_batch_size: 1
      test_batch_size: 1
      shuffle_train: false
      shuffle_val: false
      shuffle_test: false

store:
  results_path: "~/data_ML/results"
  img_exp_nb: 4
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: true
  checkpoint_frequency: 10
  use_tensorboard: false
  use_wandb: true
  wandb_project: "ChessMate"
  wandb_entity: "stmd"

test:
  processor: "~/dev/Mate/torch_model/fdq/chess_evaluator.py"
  test_model: "best"
  args:
    metrics:
      nb_test_samples: "100"

model_dump:
  checkpoint: best_val
  model_name: chessCNN
  input_source: CHESS_EXPORT
  random_input: false
  input_dtype: float32
  onnx:
    use_dynamo: false
    opset_version: 12
    input_names: ["board"]
    output_names: ["from_logits", "to_logits"]
