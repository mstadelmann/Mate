defaults:
  - wandb_keys
  - _self_

globals:
  project: Chess
  author: Marc

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: true
  dump_model_interactive: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

models:
  chessCNN:
    path: "~/dev/Mate/torch_model/fdq/chess_cnn.py"
    class_name: "ChessCNN"
    args:
      nb_in_channels: 16
      conv_channels: [64, 64, 128, 128]
      kernel_size: 3
    optimizer:
      class_name: "torch.optim.Adam"
      args:
        lr: 0.001

train:
  path: "~/dev/Mate/torch_model/fdq/train.py"
  args:
    model_name: chessCNN
    epochs: 200
    use_GPU: true
    use_AMP: false
    accumulate_grad_batches: 1
    early_stop_val_loss: 5
    early_stop_train_loss: 5
    early_stop_nan: 5
    nb_engines: null # parallel engine processes playing the train/val games; null = one per CPU core

    val:
      nb_games: 20
      max_plies_per_game: 200
      engine_command: "random"
      engine_uci_options: {}
      engine_movetime_ms: 50

losses:
  ce_from:
    class_name: "torch.nn.CrossEntropyLoss"
  ce_to:
    class_name: "torch.nn.CrossEntropyLoss"

data:
  CHESS:
    processor: "~/dev/Mate/torch_model/fdq/chess_preparator.py"
    args:
      base_path: "~/data_ML/chess/"
      train_set: "standard-chess-games_nbGames2000_minElo1800_train.chessarray"
      test_set: "standard-chess-games_nbGames2000_minElo1800_test.chessarray"
      subset_train: 1.0
      subset_test: 1.0
      val_ratio: 0.1
      pin_memory: true
      num_workers: 4
      train_batch_size: 256
      val_batch_size: 256
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false

  # Only used to build model_dump's single-board (batch=1) example tensor
  # for ONNX tracing - FDQ's exporter bakes in whatever batch size its
  # example has, and src/chess_ML.cpp always calls the model with a single
  # board, so this needs its own batch_size=1 loader, separate from the
  # batch_size=256 "CHESS" one above used for actual training. Any valid
  # dataset works here (only the tensor shape/dtype matters, not its
  # content), so this always points at the smallest/default dataset
  # regardless of which one "CHESS" above trains on.
  CHESS_EXPORT:
    processor: "~/dev/Mate/torch_model/fdq/chess_preparator.py"
    args:
      base_path: "~/data_ML/chess/"
      train_set: "standard-chess-games_nbGames2000_minElo1800_train.chessarray"
      test_set: "standard-chess-games_nbGames2000_minElo1800_test.chessarray"
      subset_train: 1.0
      subset_test: 1.0
      val_ratio: 0.1
      pin_memory: false
      num_workers: 0
      train_batch_size: 1
      val_batch_size: 1
      test_batch_size: 1
      shuffle_train: false
      shuffle_val: false
      shuffle_test: false

store:
  results_path: "~/data_ML/results"
  img_exp_nb: 4
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: true
  checkpoint_frequency: 2
  use_tensorboard: false
  use_wandb: true
  wandb_project: "Chess"
  wandb_entity: "stmd"

test:
  processor: "~/dev/Mate/torch_model/fdq/chess_evaluator.py"
  test_model: "best"
  args:
    metrics:
      nb_test_samples: "100"

model_dump:
  checkpoint: best_val
  model_name: chessCNN
  input_source: CHESS_EXPORT
  random_input: false
  input_dtype: float32
  onnx:
    use_dynamo: false
    opset_version: 12
    input_names: ["board"]
    output_names: ["from_logits", "to_logits"]
